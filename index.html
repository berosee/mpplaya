<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mpplay - Optimized Layout</title>
  <style>
    
    :root {
      --neon-blue: #00d2ff;
      --deep-blue: #4a7cff;
    }

    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #121212; }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상단 고정 영역: PC에서도 최대폭을 제한하여 구도 유지 */
    .fixed-header {
      width: 100%;
      max-width: 450px; /* PC에서 사진이 너무 커지지 않도록 제한 */
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #121212;
      z-index: 100;
      padding-bottom: 5px;
      flex-shrink: 0;
    }

    .nav, .playlist-wrapper {
      width: 92%;
    }

    .nav { 
      display: flex; 
      gap: 8px; 
      margin: 10px auto; 
      background: rgba(255, 255, 255, 0.02); 
      padding: 5px 12px; 
      border-radius: 50px; 
      width: fit-content;
      justify-content: center;
    }

    .nav a { 
      flex: none; 
      width: 60px; 
      text-decoration: none;
      background: #0a0a0a; 
      color: #444; 
      padding: 5px 0; 
      border-radius: 20px; 
      font-size: 10px; 
      text-align: center;
      transition: all 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .nav a.active { 
      background: #003366 !important; 
      color: var(--neon-blue) !important; 
      border: 1px solid var(--neon-blue); 
    }

    .player-card {
      width: 100%;
      background: none;
      text-align: center;
    }

    /* 앨범 아트: 모바일은 꽉 차게, PC는 위쪽 제한폭에 맞춤 */
    .album-art-container {
      width: 100%;
      height: 200px; 
      margin: 0 auto 8px;
      overflow: hidden;
      background: #1e293b;
      cursor: pointer; 
      transition: transform 0.2s ease;
    }

    .album-art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 곡 제목 및 하단 컨트롤 줄간격 축소 (기존의 2/3 수준) */
    .song-info .title { 
      font-size: 14px; /* 폰트 살짝 축소 */
      font-weight: bold; 
      margin-bottom: 6px; /* 줄간격 축소 */
      color: var(--neon-blue);
    }

    .status-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 15px;
      margin-bottom: 4px; /* 줄간격 축소 */
    }

    .time-display { 
      font-size: 11px; /* 폰트 축소 */
      font-family: 'Consolas', monospace; 
      color: #777;
    }

    .bar-container { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
    .bar { width: 2px; background: var(--neon-blue); height: 3px; }
    .bar.playing { animation: bounce 0.6s ease-in-out infinite alternate; }
    @keyframes bounce { from { height: 3px; } to { height: 10px; } }

    .progress-container { width: 92%; margin: 0 auto 8px; cursor: pointer; padding: 2px 0; }
    .progress-bg { height: 2px; background: rgba(255, 255, 255, 0.1); }
    .progress-fill { width: 0%; height: 100%; background: var(--neon-blue); }

    /* 재생 버튼 및 컨트롤 간격 축소 */
    .controls { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 30px; /* 버튼 간격 축소 */
      padding-bottom: 5px; 
    }

    .btn-play-box { 
      border: 1.2px solid var(--neon-blue); 
      border-radius: 50%; 
      width: 40px; height: 40px; /* 버튼 크기 축소 */
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* 재생 아이콘 폰트 크기 조정 */
    #btnIcon { font-size: 16px !important; color: var(--neon-blue); }
    .btn-nav-small { font-size: 18px !important; color: #555; background: none; border: none; cursor: pointer; }

    /* 하단 리스트 영역 */
    .playlist-wrapper { 
      flex: 1; 
      width: 100%;
      max-width: 450px; /* PC에서도 리스트 폭 제한 */
      overflow-y: auto; 
      background: rgba(0,0,0,0.4); 
      border-radius: 20px 20px 0 0;
      -webkit-overflow-scrolling: touch;
    }    
    .playlist-table { width: 100%; border-collapse: collapse; }
    .playlist-table td { 
      padding: 10px 18px; 
      font-size: 13px; 
      border-bottom: 1px solid rgba(255,255,255,0.03); 
      color: #888; cursor: pointer; 
    }    
    .playlist-table tr.active td { 
      color: var(--neon-blue); 
      background: rgba(0, 210, 255, 0.08); 
    }
  </style>

<body>

<div class="fixed-header">
  <div class="nav">
    <a href="?cat=old" id="nav-old">OLD</a>

    </div>
    
    <div class="song-info"><div class="title" id="labelTitle">곡을 선택해 주세요</div></div>
    
    <div class="status-row">
      <div class="bar-container" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="time-display"><span id="curTime">00:00</span> / <span id="durTime">00:00</span></div>
    </div>

    <div class="progress-container" id="progArea">
      <div class="progress-bg"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <div class="controls">
      <button class="btn-nav-small" id="btnPrev">⏮</button>
      <div class="btn-play-box" id="btnPlayWrap"><span id="btnIcon">▶</span></div>
      <button class="btn-nav-small" id="btnNext">⏭</button>

  </div>
</div>

const params = new URLSearchParams(window.location.search);
const curCat = params.get("cat") || "old";
const curList = playlists[curCat] || playlists["old"];

document.querySelectorAll('.nav a').forEach(el => el.classList.remove('active'));
const activeNav = document.getElementById("nav-" + curCat);
if (activeNav) activeNav.classList.add("active");

const audio = new Audio();
let curIdx = 0;
let isLoaded = false;
const listTable = document.getElementById("listTable");
const albumArt = document.getElementById("albumArt");
const labelTitle = document.getElementById("labelTitle");

curList.forEach((song, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${song.title}</td>`;
    tr.onclick = () => playSong(i);
    listTable.appendChild(tr);
});

if (curList.length > 0) {
    albumArt.src = curList[0].image;
    labelTitle.textContent = curList[0].title;
    albumArt.onerror = () => { albumArt.src = "https://via.placeholder.com/450x250?text=No+Image"; };
}

function formatTime(sec) {
    if (!sec || isNaN(sec)) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
}

function togglePlay() {
    if (!isLoaded) playSong(0);
    else audio.paused ? audio.play() : audio.pause();
}

function playSong(i) {
    curIdx = i;
    isLoaded = true;
    audio.src = curList[curIdx].url;
    audio.play().catch(e => console.log("Play blocked"));
    labelTitle.textContent = curList[curIdx].title;
    albumArt.src = curList[curIdx].image;
    updateUI();
}

function updateUI() {
    const rows = document.querySelectorAll("#listTable tr");
    rows.forEach((row, k) => row.classList.toggle("active", k === curIdx));
}

document.getElementById("albumArtBtn").onclick = togglePlay;
document.getElementById("btnPlayWrap").onclick = togglePlay;

audio.ontimeupdate = () => {
    if (audio.duration) {
        document.getElementById("curTime").textContent = formatTime(audio.currentTime);
        document.getElementById("durTime").textContent = formatTime(audio.duration);
        document.getElementById("progFill").style.width = (audio.currentTime / audio.duration * 100) + "%";
    }
};

audio.onloadedmetadata = () => { document.getElementById("durTime").textContent = formatTime(audio.duration); };
audio.onplay = () => { 
    document.getElementById("btnIcon").textContent = "Ⅱ"; 
    document.querySelectorAll(".bar").forEach(b => b.classList.add("playing"));
};
audio.onpause = () => { 
    document.getElementById("btnIcon").textContent = "▶"; 
    document.querySelectorAll(".bar").forEach(b => b.classList.remove("playing"));
};

audio.onended = () => document.getElementById("btnNext").onclick();
document.getElementById("btnNext").onclick = () => playSong((curIdx + 1) % curList.length);
document.getElementById("btnPrev").onclick = () => playSong((curIdx - 1 + curList.length) % curList.length);

document.getElementById("progArea").onclick = (e) => {
    if (audio.duration) {
        audio.currentTime = (e.offsetX / document.getElementById("progArea").clientWidth) * audio.duration;
    }
};
